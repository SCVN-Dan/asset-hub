<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Hub Usage</title>
<!-- Template for scripts/usage-report.mjs, which puts the data in place of DATA below. -->
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e1dc; --grid: #ecebe7;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85837d;
  --series: #2a78d6; --series-soft: #2a78d61f; --accent: #eda100;
  --bug: #e34948; --idea: #1baf7a; --other: #85837d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --border: #2c2c2a; --grid: #252523;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
    --series: #3987e5; --series-soft: #3987e526; --accent: #c98500;
    --bug: #e66767; --idea: #199e70; --other: #8d8c85;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --border: #2c2c2a; --grid: #252523;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8d8c85;
  --series: #3987e5; --series-soft: #3987e526; --accent: #c98500;
  --bug: #e66767; --idea: #199e70; --other: #8d8c85;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 60px; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.04em; }
.sub { color: var(--muted); font-size: 12px; }
.demo { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; background: var(--accent); color: #000; font-size: 11px; font-weight: 700; vertical-align: middle; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; color: var(--text-2); padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--series-soft); color: var(--text); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 12px; }
.tile .v { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tile .l { color: var(--text-2); font-size: 12px; }
.tile .h { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
svg text { fill: var(--muted); font-size: 11px; }
.bar { fill: var(--series); }
.hbars { display: grid; gap: 6px; }
.hbar { display: grid; grid-template-columns: minmax(80px, 46%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.hbar .track { height: 10px; }
.hbar .fill { height: 100%; background: var(--series); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar .n { font-variant-numeric: tabular-nums; color: var(--text); min-width: 3ch; text-align: right; }
.empty { color: var(--muted); font-size: 13px; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-2); font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th[aria-sort]::after { content: " ↓"; color: var(--muted); }
th[aria-sort="ascending"]::after { content: " ↑"; }
td.who { font-weight: 600; }
.zero { color: var(--muted); }
.fb { display: grid; gap: 2px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.fb:last-child { border-bottom: 0; }
.fb a { color: var(--text); text-decoration: none; font-weight: 550; }
.fb a:hover { text-decoration: underline; }
.fb .meta { color: var(--muted); font-size: 12px; }
.kind { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: var(--text-2); margin-right: 8px; }
.kind::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k); }
.closed { opacity: 0.55; }
#tip { position: fixed; pointer-events: none; z-index: 9; padding: 6px 10px; border-radius: 8px; background: var(--text); color: var(--surface); font-size: 12px; white-space: nowrap; display: none; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Asset Hub usage <span id="demo"></span></h1>
      <div class="sub" id="meta"></div>
    </div>
    <div class="seg" role="group" aria-label="Period" id="period"></div>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <h2>People using the app each day</h2>
    <div id="daily"></div>
  </section>

  <section class="card">
    <h2>People</h2>
    <div class="scroll"><table id="people"></table></div>
  </section>

  <section class="grid2">
    <div class="card"><h2>Asset types viewed</h2><div class="hbars" id="types"></div></div>
    <div class="card"><h2>Repos opened (people)</h2><div class="hbars" id="repos"></div></div>
    <div class="card"><h2>Errors</h2><div class="hbars" id="errors"></div></div>
    <div class="card"><h2>Version in use (latest per person)</h2><div class="hbars" id="versions"></div></div>
  </section>

  <section class="card">
    <h2 style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">Feedback <span class="seg" id="fbfilter" role="group" aria-label="Feedback type"></span></h2>
    <div id="feedback"></div>
  </section>
</main>
<div id="tip" role="tooltip"></div>
<script>
const DATA = /*DATA*/null
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const num = (n) => n.toLocaleString('en-US')
const hours = (ms) => ms >= 3600e3 ? `${(ms / 3600e3).toFixed(1)} h` : `${Math.round(ms / 60e3)} min`
const day = (iso) => iso.slice(0, 10)
const ago = (iso) => {
  const d = Math.floor((Date.now() - Date.parse(iso)) / 864e5)
  return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`
}
const sumKeys = (counts, test) => Object.entries(counts).reduce((t, [k, v]) => (test(k) ? t + v : t), 0)
const c = (s, k) => s.counts[k] ?? 0

let period = 30
let fbKind = 'all'
let sort = { key: 'active', dir: -1 }

const tip = $('tip')
document.addEventListener('pointermove', (e) => {
  const t = e.target.closest('[data-tip]')
  if (!t) return (tip.style.display = 'none')
  tip.textContent = t.dataset.tip
  tip.style.display = 'block'
  const x = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)
  tip.style.left = `${x}px`
  tip.style.top = `${e.clientY - tip.offsetHeight - 10}px`
})

function inPeriod(iso) {
  return period === 0 || Date.parse(iso) >= Date.now() - period * 864e5
}

function hbars(el, rows, unit = '') {
  rows = rows.filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 10)
  if (!rows.length) return (el.innerHTML = '<div class="empty">Nothing yet</div>')
  const max = rows[0][1]
  el.innerHTML = rows
    .map(([name, n]) => `<div class="hbar" data-tip="${esc(name)}: ${num(n)}${unit}"><span class="name">${esc(name)}</span><div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div><span class="n">${num(n)}</span></div>`)
    .join('')
}

function render() {
  const sessions = DATA.sessions.filter((s) => inPeriod(s.start))
  const people = new Map()
  for (const s of sessions) {
    const p = people.get(s.login) ?? { login: s.login, sessions: 0, active: 0, first: s.start, last: s.end, version: s.version, versionAt: s.start, branches: 0, views: 0, searches: 0, exports: 0, exportedAssets: 0, unity: 0, ai: 0, errors: 0, language: s.language }
    p.sessions++
    p.active += s.activeMs
    if (s.start < p.first) p.first = s.start
    if (s.end > p.last) p.last = s.end
    if (s.start >= p.versionAt) (p.version = s.version), (p.versionAt = s.start), (p.language = s.language)
    p.branches += c(s, 'branch.open')
    p.views += sumKeys(s.counts, (k) => k.startsWith('view.'))
    p.searches += c(s, 'search')
    p.exports += c(s, 'export')
    p.exportedAssets += c(s, 'export.assets') + c(s, 'unity.assets')
    p.unity += c(s, 'unity')
    p.ai += c(s, 'ai.chat')
    p.errors += sumKeys(s.counts, (k) => k.startsWith('error.'))
    people.set(s.login, p)
  }
  const all = [...people.values()]
  const total = (k) => all.reduce((t, p) => t + p[k], 0)

  // Tiles
  const totalActive = total('active')
  const tiles = [
    ['People', num(all.length), `${num(new Set(DATA.sessions.map((s) => s.login)).size)} ever`],
    ['Sessions', num(sessions.length), all.length ? `${(sessions.length / all.length).toFixed(1)} per person` : ''],
    ['Time in app', hours(totalActive), sessions.length ? `${hours(totalActive / sessions.length)} per session` : ''],
    ['Exports', num(total('exports') + total('unity')), `${num(total('exportedAssets'))} assets · ${num(total('unity'))} to Unity`],
    ['Feedback', num(DATA.feedback.filter((f) => inPeriod(f.at)).length), `${num(DATA.feedback.filter((f) => f.state === 'open').length)} open in total`]
  ]
  $('tiles').innerHTML = tiles.map(([l, v, h]) => `<div class="card tile"><div class="l">${l}</div><div class="v">${v}</div><div class="h">${esc(h)}</div></div>`).join('')

  // Daily active people: one series, so no legend; the title names it.
  const days = period || Math.max(1, Math.ceil((Date.now() - Math.min(...DATA.sessions.map((s) => Date.parse(s.start)), Date.now())) / 864e5) + 1)
  const list = []
  for (let i = days - 1; i >= 0; i--) list.push(day(new Date(Date.now() - i * 864e5).toISOString()))
  const byDay = new Map(list.map((d) => [d, { people: new Set(), active: 0 }]))
  for (const s of sessions) {
    const b = byDay.get(day(s.start))
    if (b) b.people.add(s.login), (b.active += s.activeMs)
  }
  const W = 1000, H = 180, L = 28, B = 22, T = 8
  const max = Math.max(1, ...[...byDay.values()].map((b) => b.people.size))
  const step = (W - L) / list.length
  const bw = Math.max(2, step - 2)
  const y = (v) => H - B - (v / max) * (H - B - T)
  const ticks = [...new Set([0, Math.ceil(max / 2), max])]
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="People using the app each day">`
  for (const t of ticks) svg += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`
  list.forEach((d, i) => {
    const b = byDay.get(d)
    const n = b.people.size
    const x = L + i * step + 1
    const label = `${d}: ${n} ${n === 1 ? 'person' : 'people'}${n ? ` · ${hours(b.active)} · ${[...b.people].join(', ')}` : ''}`
    if (n) {
      const top = y(n), h = H - B - top, r = Math.min(4, bw / 2, h)
      svg += `<path class="bar" d="M${x},${H - B} V${top + r} q0,-${r} ${r},-${r} h${bw - 2 * r} q${r},0 ${r},${r} V${H - B} Z"/>`
    }
    svg += `<rect x="${x - 1}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent" data-tip="${esc(label)}"/>`
    const every = Math.ceil(list.length / 8)
    if (i % every === 0) svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${d.slice(5)}</text>`
  })
  $('daily').innerHTML = svg + `<line x1="${L}" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="var(--border)"/></svg>`

  // People table
  const cols = [
    ['login', 'Name'], ['sessions', 'Sessions'], ['active', 'Time'], ['last', 'Last seen'], ['branches', 'Branches'], ['views', 'Views'],
    ['searches', 'Searches'], ['exports', 'Exports'], ['unity', 'To Unity'], ['ai', 'AI chats'], ['errors', 'Errors'], ['version', 'Version']
  ]
  all.sort((a, b) => (a[sort.key] < b[sort.key] ? -1 : a[sort.key] > b[sort.key] ? 1 : 0) * sort.dir)
  const cell = (k, p) => {
    const v = p[k]
    if (k === 'login') return `<td class="who">${esc(v)}</td>`
    if (k === 'active') return `<td data-tip="${esc(hours(v / p.sessions))} per session">${hours(v)}</td>`
    if (k === 'last') return `<td data-tip="${esc(new Date(v).toLocaleString())} · first ${esc(day(p.first))}">${ago(v)}</td>`
    if (k === 'version') return `<td>${esc(v)} <span class="zero">${esc(p.language)}</span></td>`
    return `<td class="${v ? '' : 'zero'}">${num(v)}</td>`
  }
  $('people').innerHTML =
    `<thead><tr>${cols.map(([k, l]) => `<th data-key="${k}" ${sort.key === k ? `aria-sort="${sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}</th>`).join('')}</tr></thead>` +
    `<tbody>${all.length ? all.map((p) => `<tr>${cols.map(([k]) => cell(k, p)).join('')}</tr>`).join('') : `<tr><td colspan="${cols.length}" class="empty">No sessions in this period</td></tr>`}</tbody>`

  // Breakdowns
  const counter = (prefix) => {
    const m = new Map()
    for (const s of sessions) for (const [k, v] of Object.entries(s.counts)) if (k.startsWith(prefix) && !k.endsWith('.fail')) m.set(k.slice(prefix.length), (m.get(k.slice(prefix.length)) ?? 0) + v)
    return [...m]
  }
  hbars($('types'), counter('view.'))
  const repos = new Map()
  for (const s of sessions) for (const r of s.repos) (repos.get(r) ?? repos.set(r, new Set()).get(r)).add(s.login)
  hbars($('repos'), [...repos].map(([r, set]) => [r, set.size]), ' people')
  hbars($('errors'), counter('error.'), ' times')
  const versions = new Map()
  for (const p of all) versions.set(p.version, (versions.get(p.version) ?? 0) + 1)
  hbars($('versions'), [...versions].map(([v, n]) => [`v${v}`, n]), ' people')

  // Feedback (open first, newest first)
  const KIND = { bug: ['Bug', 'var(--bug)'], idea: ['Idea', 'var(--idea)'], other: ['Other', 'var(--other)'] }
  const fb = DATA.feedback.filter((f) => inPeriod(f.at) && (fbKind === 'all' || f.kind === fbKind)).sort((a, b) => (a.state === b.state ? b.at.localeCompare(a.at) : a.state === 'open' ? -1 : 1))
  $('feedback').innerHTML = fb.length
    ? fb.map((f) => `<div class="fb ${f.state === 'closed' ? 'closed' : ''}"><div><span class="kind" style="--k:${KIND[f.kind][1]}">${KIND[f.kind][0]}</span><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.title)}</a></div><div class="meta">${esc(f.login)} · ${ago(f.at)} · ${f.state}${f.comments ? ` · ${f.comments} comment${f.comments === 1 ? "" : "s"}` : ''}</div></div>`).join('')
    : '<div class="empty">No feedback in this period</div>'
}

function segs(el, options, get, set) {
  el.innerHTML = options.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${get() === v}">${l}</button>`).join('')
  el.onclick = (e) => {
    const b = e.target.closest('button')
    if (!b) return
    set(isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v)
    el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b))
    render()
  }
}

$('people').onclick = (e) => {
  const th = e.target.closest('th')
  if (!th) return
  const key = th.dataset.key
  sort = { key, dir: sort.key === key ? -sort.dir : key === 'login' ? 1 : -1 }
  render()
}
segs($('period'), [[7, '7 days'], [30, '30 days'], [90, '90 days'], [0, 'All']], () => period, (v) => (period = v))
segs($('fbfilter'), [['all', 'All'], ['bug', 'Bugs'], ['idea', 'Ideas'], ['other', 'Other']], () => fbKind, (v) => (fbKind = v))
$('meta').textContent = `${DATA.repo} · built ${new Date(DATA.generated).toLocaleString()} · ${DATA.sessions.length} sessions in total`
if (DATA.demo) $('demo').innerHTML = '<span class="demo">DEMO DATA</span>'
render()
</script>
</body>
</html>
