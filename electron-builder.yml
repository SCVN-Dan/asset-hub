# Packaging (Phase 10), Apple Silicon (M1–M4) only. `npm run dist`: the full .dmg; `npm run dist:web`: the zip
# the small web installer downloads, and that installer's .dmg (scripts/make-web-installer.mjs).
appId: vn.supercent.assethub
productName: Asset Hub
copyright: Supercent
directories:
  output: release
  buildResources: build
# Everything the app runs is bundled into out/ (main needs only Node and Electron), so no node_modules.
files:
  - out/**/*
  - package.json
# Electron's own UI strings: only the app's languages.
electronLanguages: [en, vi, ko]
protocols:
  - name: Asset Hub link
    schemes: [assethub]
mac:
  target:
    - target: dmg
      arch: [arm64]
    # For the web installer: a zip under a fixed name, so releases/latest/download/Asset-Hub-arm64.zip
    # always points at the newest version.
    - target: zip
      arch: [arm64]
  artifactName: Asset-Hub-${arch}.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # No Apple Developer ID yet: electron-builder's signing is off and scripts/adhoc-sign.cjs signs ad hoc,
  # which Apple Silicon needs to run the app at all (opened the first time via right-click > Open).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
afterPack: scripts/adhoc-sign.cjs
dmg:
  title: Asset Hub ${version}
  artifactName: Asset-Hub-${version}-${arch}.${ext}
